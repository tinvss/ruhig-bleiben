<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#16263f">
<title>Ruhig bleiben Atem</title>
<style>
  html, body {
    margin: 0; height: 100%; color-scheme: dark; overflow: hidden;
    background: #16263f; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  #wrap { position: fixed; left: 0; right: 0; top: env(safe-area-inset-top, 0px); bottom: env(safe-area-inset-bottom, 0px); display: flex; justify-content: center; background: #0d1626; }
  #game { position: relative; height: 100%; width: 100%; max-width: calc(100vh * 0.6); }
  canvas { display: block; width: 100%; height: 100%; }
  #ov {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 24px; box-sizing: border-box; gap: 18px;
    background: rgba(13, 22, 38, 0.55);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  #ov.hidden { display: none; }
  #ov h1 { margin: 0; font-size: clamp(40px, 12vw, 64px); font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; }
  #ov p { margin: 0; font-size: clamp(20px, 5.5vw, 26px); line-height: 1.4; opacity: 0.9; white-space: pre-line; }
  #ov pre {
    margin: 0; font-family: inherit; font-size: clamp(18px, 5vw, 24px); line-height: 1.5;
    background: rgba(255,255,255,0.1); padding: 16px 20px; border-radius: 16px; white-space: pre; text-align: left; -webkit-user-select: text; user-select: text;
  }
  #ov button {
    font: inherit; font-size: clamp(22px, 6vw, 28px); font-weight: 600;
    color: #16263f; background: #fff; border: 0; border-radius: 999px;
    padding: 16px 44px; cursor: pointer;
  }
  #ov button.ghost { background: transparent; color: #fff; border: 2px solid rgba(255,255,255,0.6); }
  #btns { display: flex; flex-direction: column; gap: 12px; align-items: center; }
  #ov .tag { font-size: clamp(16px, 4.5vw, 20px); letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.7; }
</style>
</head>
<body>
<div id="wrap"><div id="game">
  <canvas id="c"></canvas>
  <div id="ov"></div>
</div></div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const ov = document.getElementById('ov');

  // ---------- Konfiguration ----------
  // gates: Anzahl Tore · types: welche Torarten · enemies: welche Gegner · every: Sekunden zwischen Gegnern
  const LEVELS = [
    { name: 'Abend',  hint: 'Halten: einatmen.\nLoslassen: ausatmen.\nNachrichten nicht antippen.',
      gates: 14, pace: 1.00, types: ['still'],                     enemies: [],                every: 99,  homing: 0.0, popEvery: 5.0,
      calm: { top: [22, 38, 66], bot: [232, 176, 158] } },
    { name: 'Stadt',  hint: 'Tore atmen.\nWecker klingeln.',
      gates: 18, pace: 1.10, types: ['still', 'atmend'],           enemies: ['wecker'],         every: 4.0, homing: 0.0, popEvery: 4.0,
      calm: { top: [14, 50, 62], bot: [168, 158, 214] } },
    { name: 'Montag', hint: 'Viel Glück.',
      gates: 22, pace: 1.15, types: ['still', 'atmend', 'wandernd'], enemies: ['ping', 'wecker'], every: 3.2, homing: 0.2, popEvery: 3.2,
      calm: { top: [38, 22, 66], bot: [238, 186, 110] } },
  ];
  // Pop-ups wie auf dem echten Handy: [App, Farbe, Text]
  const POPUPS = [
    ['Chef', '#3b82f6', 'Hast du kurz Zeit?'],
    ['Mama', '#22c55e', 'Ruf mal an.'],
    ['Akku', '#ef4444', 'Noch 5 %'],
    ['Mail', '#0ea5e9', '17 neue Nachrichten'],
    ['Paket', '#f59e0b', 'Zustellung fehlgeschlagen'],
    ['Kalender', '#ef4444', 'Zahnarzt in 10 Min.'],
    ['Gruppe', '#22c55e', 'Familie (43)'],
    ['Bank', '#64748b', 'Ungewöhnliche Aktivität'],
    ['System', '#64748b', 'Update verfügbar'],
    ['Bildschirmzeit', '#8b5cf6', '+38 % diese Woche'],
    ['Vermieter', '#3b82f6', 'Wegen der Nebenkosten …'],
    ['Sale', '#ec4899', 'Nur noch heute!'],
  ];
  const SAYINGS = [
    'Atmen.', 'Wohin so schnell?', 'Langsam.', 'Ganz ruhig.', 'Hast du’s eilig?',
    'Puls?', 'Weniger.', 'Schhh.', 'Bringt nix.', 'Tief durch.', 'Wozu?', 'Nein.',
  ];
  const NERVES = 3;
  const EMOJI_SEGMENTS = 8;

  // ---------- Hilfen ----------
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const mix = (c1, c2, t) => c1.map((v, i) => Math.round(lerp(v, c2[i], t)));
  const rgb = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const rand = (a, b) => a + Math.random() * (b - a);

  const STRESS = { top: [70, 0, 0], bot: [255, 24, 16], obst: [20, 0, 0], ball: [255, 235, 40] };
  const CALM_OBST = [255, 255, 255], CALM_BALL = [255, 255, 255];

  // ---------- Größe ----------
  let W = 0, H = 0, DPR = 1;
  function resize() {
    const r = canvas.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Audio ----------
  const audio = {
    ctx: null,
    init() {
      if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      const a = this.ctx = new AC();
      this.master = a.createGain(); this.master.gain.value = 0.9; this.master.connect(a.destination);

      // ruhiger Klangteppich
      this.padFilter = a.createBiquadFilter(); this.padFilter.type = 'lowpass'; this.padFilter.frequency.value = 700;
      this.padGain = a.createGain(); this.padGain.gain.value = 0;
      this.padFilter.connect(this.padGain).connect(this.master);
      [220, 277.2, 329.6].forEach((f, i) => {
        const o = a.createOscillator(); o.type = 'sine'; o.frequency.value = f;
        const g = a.createGain(); g.gain.value = i === 0 ? 0.5 : 0.3;
        o.connect(g).connect(this.padFilter); o.start();
      });

      // Stress-Brummen: zwei verstimmte Sägezähne, die gegeneinander schweben
      this.stressGain = a.createGain(); this.stressGain.gain.value = 0;
      this.stressGain.connect(this.master);
      this.s1 = a.createOscillator(); this.s1.type = 'sawtooth'; this.s1.frequency.value = 110;
      this.s2 = a.createOscillator(); this.s2.type = 'sawtooth'; this.s2.frequency.value = 116.5;
      this.s1.connect(this.stressGain); this.s2.connect(this.stressGain);
      this.s1.start(); this.s2.start();
      this.tickTimer = 0;
    },
    update(s, dt, active) {
      if (!this.ctx) return;
      const t = this.ctx.currentTime;
      const on = active ? 1 : 0.35;
      this.padGain.gain.setTargetAtTime((0.05 * (1 - s) + 0.008) * on, t, 0.3);
      this.padFilter.frequency.setTargetAtTime(lerp(700, 2200, s), t, 0.3);
      this.stressGain.gain.setTargetAtTime(0.06 * s * s * on, t, 0.15);
      this.s1.frequency.setTargetAtTime(110 + 70 * s, t, 0.2);
      this.s2.frequency.setTargetAtTime(116.5 + 95 * s, t, 0.2);
      // nervöses Ticken ab mittlerem Stress
      if (active && s > 0.3) {
        this.tickTimer -= dt;
        if (this.tickTimer <= 0) {
          this.tickTimer = lerp(0.8, 0.14, (s - 0.3) / 0.7);
          this.blip(1900, 0.03, 'square', 0.05 * s);
        }
      }
    },
    blip(freq, dur, type, vol, slideTo, delay = 0) {
      if (!this.ctx) return;
      const a = this.ctx, t = a.currentTime + delay;
      const o = a.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
      const g = a.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(this.master); o.start(t); o.stop(t + dur + 0.05);
    },
    breathe(inhale, s) {
      if (s < 0.5) this.blip(inhale ? 330 : 440, 0.6, 'sine', 0.06, inhale ? 440 : 330);
      else this.blip(lerp(700, 1100, (s - 0.5) * 2), 0.08, 'square', 0.07);
    },
    popIn() { this.blip(1046.5, 0.15, 'sine', 0.06); this.blip(1318.5, 0.2, 'sine', 0.06, null, 0.1); },
    popTap() { this.blip(200, 0.25, 'square', 0.08, 120); },
    popGone() { this.blip(660, 0.3, 'sine', 0.03, 520); },
    ping() { this.blip(1320, 0.12, 'sine', 0.08); this.blip(1760, 0.18, 'sine', 0.08, null, 0.09); },
    ring() { for (let i = 0; i < 8; i++) this.blip(i % 2 ? 2400 : 2000, 0.05, 'square', 0.035, null, i * 0.06); },
    firefly() { this.blip(880, 0.4, 'sine', 0.07, 1320); },
    shield() { [523.3, 784, 1046.5].forEach((f, i) => this.blip(f, 1.2, 'sine', 0.05, null, i * 0.08)); },
    hit() { this.blip(220, 0.35, 'sawtooth', 0.14, 60); },
    crash() { this.blip(180, 0.6, 'sawtooth', 0.16, 40); },
    win() { [523.3, 659.3, 784, 1046.5].forEach((f, i) => this.blip(f, 0.9, 'sine', 0.1, null, i * 0.16)); },
  };

  // ---------- Spielzustand ----------
  let state = 'title';        // title | intro | ready | play | crashed | done | end
  let levelIdx = 0;
  let stress = 0.15, stressTarget = 0;
  let presses = [];          // Zeitpunkte, an denen der Finger aufgesetzt wurde
  const pointers = new Set();
  let holding = false, inhale = 0;
  let popups = [], popTimer = 0, ignored = 0, tappedPops = 0;
  let ball, gates, enemies, flies, finish;
  let sinceSpawn, gatesSpawned, gatesPassed, nextSpacing, enemyTimer, gameTime;
  let nerves, invuln, shield, calmTimer, fliesLevel, flash;
  let attempts = [0, 0, 0];
  let results = [];           // pro Level: { samples, attempts, nerves, flies }
  let samples = [], sampleTimer = 0;
  let saying = null, sayCooldown = 0, wasStressed = false;
  let particles = [];
  let time = 0;

  for (let i = 0; i < 40; i++) {
    particles.push({ x: Math.random(), y: Math.random(), r: Math.random() * 2 + 0.5, v: Math.random() * 0.5 + 0.5 });
  }

  function resetLevel() {
    ball = { x: W * 0.28, y: H * 0.45, vy: 0 };
    gates = []; enemies = []; flies = [];
    finish = null;
    sinceSpawn = 0; gatesSpawned = 0; gatesPassed = 0;
    nextSpacing = H * 0.2;
    enemyTimer = 3; gameTime = 0;
    ignored = 0; tappedPops = 0;
    nerves = NERVES; invuln = 0; shield = false; calmTimer = 0; fliesLevel = 0; flash = 0;
    stress = Math.min(stress, 0.25);
    presses = []; pointers.clear(); holding = false; inhale = 0;
    popups = []; popTimer = 2.5;
    samples = []; sampleTimer = 0;
    saying = null; wasStressed = false;
  }

  function say(text, soft) {
    saying = { text, t: 0, soft: !!soft };
    sayCooldown = 2.6;
  }

  // ---------- Eingabe ----------
  // Halten = einatmen (steigen), Loslassen = ausatmen (sinken)
  function press(e) {
    if (e) e.preventDefault();
    audio.init();
    if (state !== 'ready' && state !== 'play') return;
    // Wer auf ein Pop-up drückt, hat es angetippt
    if (e && e.clientX !== undefined) {
      const rc = canvas.getBoundingClientRect();
      const px = e.clientX - rc.left, py = e.clientY - rc.top;
      for (let i = popups.length - 1; i >= 0; i--) {
        const p = popups[i];
        if (!p.gone && px > p.x && px < p.x + p.w && py > p.y && py < p.y + p.h) { tapPopup(p); return; }
      }
    }
    if (state === 'ready') state = 'play';
    pointers.add(e && e.pointerId !== undefined ? e.pointerId : 'key');
    if (!holding) {
      holding = true;
      presses.push(performance.now() / 1000);
      audio.breathe(true, stress);
    }
  }
  function release(e) {
    pointers.delete(e && e.pointerId !== undefined ? e.pointerId : 'key');
    if (holding && pointers.size === 0) {
      holding = false;
      if (state === 'play') audio.breathe(false, stress);
    }
  }
  canvas.addEventListener('pointerdown', press);
  window.addEventListener('pointerup', release);
  window.addEventListener('pointercancel', release);
  window.addEventListener('blur', () => { pointers.clear(); holding = false; });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      if (e.repeat) { e.preventDefault(); return; }
      if (state === 'ready' || state === 'play') press(e);
      else { const b = ov.querySelector('button'); if (b) { e.preventDefault(); b.click(); } }
    }
  });
  window.addEventListener('keyup', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp') release(e);
  });

  // ---------- Pop-ups ----------
  function spawnPopup(near) {
    if (popups.filter(p => !p.gone).length >= 3) return;
    const [app, color, text] = pick(POPUPS);
    const w = W * 0.88, h = Math.max(64, H * 0.085);
    let y = near !== undefined ? near : rand(0.14, 0.8) * H;
    y = clamp(y, H * 0.13, H * 0.88 - h);
    popups.push({ app, color, text, x: (W - w) / 2, y, w, h, t: 0, life: rand(3.2, 4.2) * lerp(1, 1.6, stress), gone: false, out: 0 });
    audio.popIn();
  }
  function tapPopup(p) {
    p.gone = true; p.tapped = true;
    tappedPops++;
    stress = Math.min(1, stress + 0.35);
    audio.popTap();
    say(pick(['Nicht antippen.', 'Jetzt sind es zwei.', 'Musste das sein?', 'Später.']));
    // Antworten erzeugt neue Nachrichten
    setTimeout(() => { if (state === 'play') { spawnPopup(p.y - H * 0.12); spawnPopup(p.y + H * 0.12); } }, 400);
  }

  // ---------- Overlays ----------
  function showOverlay(html, handlers) {
    ov.innerHTML = html;
    ov.classList.remove('hidden');
    for (const [id, fn] of Object.entries(handlers || {})) {
      const el = ov.querySelector('#' + id);
      if (el) el.addEventListener('click', ev => { ev.stopPropagation(); audio.init(); fn(); });
    }
  }
  function hideOverlay() { ov.classList.add('hidden'); ov.innerHTML = ''; }

  function showTitle() {
    state = 'title';
    showOverlay(`
      <h1>Ruhig<br>bleiben</h1>
      <p>Halten zum Einatmen.\nWer hetzt, verliert.</p>
      <button id="go">Los</button>`, { go: () => showIntro(0) });
  }

  function showIntro(i) {
    levelIdx = i;
    resetLevel();
    state = 'intro';
    const L = LEVELS[i];
    showOverlay(`
      <div class="tag">Level ${i + 1} von ${LEVELS.length}</div>
      <h1>${L.name}</h1>
      <p>${L.hint}</p>
      <button id="go">Los</button>`, { go: () => startLevel(i) });
  }

  function startLevel(i) {
    levelIdx = i;
    resetLevel();
    state = 'ready';
    hideOverlay();
  }

  function crash() {
    state = 'crashed';
    attempts[levelIdx]++;
    audio.crash();
    const msg = stress > 0.55 ? pick(['Siehste.', 'Tja.', 'Zu schnell.']) : 'Nerven weg.';
    setTimeout(() => {
      showOverlay(`<h1>${msg}</h1><p>${LEVELS[levelIdx].name} · ${gatesPassed}/${LEVELS[levelIdx].gates}</p><button id="retry">Nochmal</button>`,
        { retry: () => startLevel(levelIdx) });
    }, 600);
  }

  function levelDone() {
    state = 'done';
    attempts[levelIdx]++;
    results[levelIdx] = { samples: samples.slice(), attempts: attempts[levelIdx], nerves, flies: fliesLevel, ignored, tappedPops };
    audio.win();
    const r = results[levelIdx];
    if (levelIdx < LEVELS.length - 1) {
      showOverlay(`
        <div class="tag">Level ${levelIdx + 1} geschafft</div>
        <h1>${LEVELS[levelIdx].name}</h1>
        <pre>${resultLine(r)}</pre>
        <p>🔕 ${r.ignored} ignoriert · 👆 ${r.tappedPops} angetippt</p>
        <p>Ruhe ${calmPercent(r.samples)}%</p>
        <button id="next">Weiter</button>`, { next: () => showIntro(levelIdx + 1) });
    } else {
      showEnd();
    }
  }

  // ---------- Ergebnis ----------
  function calmPercent(s) {
    if (!s.length) return 100;
    return Math.round(100 * (1 - s.reduce((a, b) => a + b, 0) / s.length));
  }
  function emojiRow(s) {
    let out = '';
    for (let i = 0; i < EMOJI_SEGMENTS; i++) {
      const a = Math.floor(i * s.length / EMOJI_SEGMENTS);
      const b = Math.max(a + 1, Math.floor((i + 1) * s.length / EMOJI_SEGMENTS));
      const seg = s.slice(a, b);
      const m = seg.length ? seg.reduce((x, y) => x + y, 0) / seg.length : 0;
      out += m < 0.3 ? '🟩' : m < 0.6 ? '🟨' : '🟥';
    }
    return out;
  }
  const hearts = n => '❤️'.repeat(n) + '🖤'.repeat(NERVES - n);
  const resultLine = r => `${emojiRow(r.samples)} ${hearts(r.nerves)}`;
  function shareText() {
    const all = results.flatMap(r => r.samples);
    const fl = results.reduce((a, r) => a + r.flies, 0);
    const tries = results.reduce((a, r) => a + r.attempts, 0);
    const lines = results.map((r, i) => `L${i + 1} ${resultLine(r)}`);
    return `Ruhig bleiben 🫧 ${results.length}/${LEVELS.length}\n${lines.join('\n')}\nRuhe ${calmPercent(all)}% · ✨${fl} · ${tries} Versuche\n🔕 ${results.reduce((a, r) => a + r.ignored, 0)} ignoriert · 👆 ${results.reduce((a, r) => a + r.tappedPops, 0)} angetippt`;
  }
  function showEnd() {
    state = 'end';
    const text = shareText();
    showOverlay(`
      <h1>Ruhig<br>geblieben.</h1>
      <pre>${text}</pre>
      <div id="btns">
        <button id="share">Teilen</button>
        <button id="again" class="ghost">Nochmal</button>
      </div>`, {
      share: async () => {
        const btn = ov.querySelector('#share');
        try { await navigator.share({ text }); return; } catch (_) {}
        try {
          await navigator.clipboard.writeText(text);
          btn.textContent = 'Kopiert';
        } catch (_) {
          // Fallback: Text markieren, damit man ihn selbst kopieren kann
          const sel = window.getSelection(), range = document.createRange();
          range.selectNodeContents(ov.querySelector('pre'));
          sel.removeAllRanges(); sel.addRange(range);
          btn.textContent = 'Text markiert';
        }
      },
      again: () => { attempts = [0, 0, 0]; results = []; showIntro(0); },
    });
  }

  // ---------- Treffer ----------
  function hurt() {
    if (invuln > 0) return;
    if (shield) {
      shield = false; invuln = 1.0; calmTimer = 0;
      audio.hit(); say('Egal.', true);
      return;
    }
    nerves--;
    invuln = 1.6;
    flash = 1;
    stress = Math.min(1, stress + 0.3);   // Schreck
    audio.hit();
    if (nerves <= 0) crash();
    else if (sayCooldown <= 0) say(pick(['Autsch.', 'Hm.', 'Weiter.']));
  }

  // ---------- Update ----------
  function updateStress(dt) {
    const now = performance.now() / 1000;
    presses = presses.filter(t => now - t < 3);
    // Ruhiges Atmen: etwa ein Atemzug alle 2-4 Sekunden. Hektisch: ständiges An und Aus.
    const rate = presses.length / 3;
    let target = clamp((rate - 0.6) / 1.4, 0, 1);
    stressTarget = clamp(target, 0, 1);
    const k = stressTarget > stress ? 3.5 : 1.0;
    stress += (stressTarget - stress) * (1 - Math.exp(-dt * k));
  }

  function spawnGate(L) {
    const prev = gates.length ? gates[gates.length - 1].gy0 : H * 0.45;
    const type = pick(L.types);
    const gap0 = H * lerp(0.235, 0.16, stress) * (type === 'atmend' ? 1.15 : 1);
    const gy0 = clamp(prev + (Math.random() - 0.5) * H * 0.55, H * 0.22, H * 0.78);
    const g = { x: W + 10, w: H * 0.085, gy0, gy: gy0, gap0, gap: gap0, type, phase: Math.random() * 6.28, passed: false };
    gates.push(g);
    // Glühwürmchen in der Lücke oder kurz dahinter
    if (Math.random() < 0.75) {
      flies.push({ x: g.x + g.w / 2 + (Math.random() < 0.5 ? 0 : H * 0.18), y: gy0 + rand(-0.4, 0.4) * gap0, ph: Math.random() * 6.28, got: false });
    }
  }

  function spawnEnemy(L) {
    if (!L.enemies.length) return;
    const kind = pick(L.enemies);
    const y = rand(0.15, 0.85) * H;
    if (kind === 'ping') {
      enemies.push({ kind, x: W + 30, y, vy: 0, size: H * 0.028, ph: Math.random() * 6.28 });
      audio.ping();
    } else {
      enemies.push({ kind, x: W + 30, y, vy: (Math.random() < 0.5 ? -1 : 1) * H * 0.35, size: H * 0.03, ph: 0 });
      audio.ring();
    }
  }

  function update(dt) {
    time += dt;
    if (state === 'play' || state === 'ready') updateStress(dt);
    else if (state !== 'crashed') stress += (0.1 - stress) * (1 - Math.exp(-dt * 0.8));
    audio.update(stress, dt, state === 'play');

    const L = LEVELS[levelIdx];
    const ts = (0.75 + 0.7 * stress) * L.pace;   // Zeitlupe, wenn ruhig
    const sdt = dt * ts;

    for (const p of particles) {
      p.x -= sdt * p.v * (0.03 + stress * 0.6);
      p.y += Math.sin(time * 0.5 + p.v * 10) * dt * 0.004 * (1 - stress);
      if (p.x < -0.05) { p.x = 1.05; p.y = Math.random(); }
    }

    if (saying) { saying.t += dt; if (saying.t > 1.6) saying = null; }
    sayCooldown -= dt;
    flash = Math.max(0, flash - dt * 2.5);

    inhale += ((holding ? 1 : 0) - inhale) * (1 - Math.exp(-dt * 4));
    if (state === 'ready') {
      ball.y = H * 0.45 + Math.sin(time * 2) * H * 0.01;
      return;
    }
    if (state !== 'play') return;

    // Pop-ups: kommen in echter Zeit, Hektik lockt mehr an und lässt sie länger bleiben
    popTimer -= dt;
    if (popTimer <= 0 && !finish) { spawnPopup(); popTimer = L.popEvery * rand(0.7, 1.3) * lerp(1, 0.55, stress); }
    for (const p of popups) {
      p.t += dt;
      if (p.gone) p.out += dt * 4;
      else if (p.t > p.life) { p.gone = true; ignored++; audio.popGone(); }
    }
    popups = popups.filter(p => p.out < 1);
    gameTime += sdt;
    invuln = Math.max(0, invuln - dt);

    // Sprüche
    if (stress > 0.55 && stressTarget > 0.5 && sayCooldown <= 0) { say(pick(SAYINGS)); wasStressed = true; }
    if (wasStressed && stress < 0.2 && sayCooldown <= 0) { say(pick(['Besser.', 'Gut.', 'So.']), true); wasStressed = false; }

    // Gelassenheit: lange ruhig = Schild, das einen Treffer schluckt
    if (stress < 0.15) calmTimer += dt; else if (stress > 0.3) calmTimer = 0;
    if (!shield && calmTimer > 3) { shield = true; audio.shield(); if (sayCooldown <= 0) say('Gelassen.', true); }
    if (shield && stress > 0.45) { shield = false; calmTimer = 0; }

    // Kugel
    const targetV = (holding ? -1 : 1) * H * 0.42;
    ball.vy += (targetV - ball.vy) * (1 - Math.exp(-sdt * 3.2));
    ball.y += ball.vy * sdt;
    const r = H * 0.022;
    if (ball.y < r) { ball.y = r; ball.vy = 0; }
    if (ball.y > H - r) {
      ball.y = H - r; ball.vy = -H * 0.5;
      hurt();
      if (state !== 'play') return;
    }

    // Welt bewegen
    const speed = H * 0.34;
    const dx = speed * sdt;
    for (const g of gates) {
      g.x -= dx;
      if (g.type === 'atmend') {
        g.gap = g.gap0 * (0.68 + 0.32 * (0.5 + 0.5 * Math.sin(g.phase + gameTime * 1.6)));
      } else if (g.type === 'wandernd') {
        g.gy = clamp(g.gy0 + Math.sin(g.phase + gameTime * 1.3) * H * 0.11, H * 0.18, H * 0.82);
      }
    }
    for (const f of flies) { f.x -= dx; f.ph += dt * 3; }
    if (finish) finish.x -= dx;
    gates = gates.filter(g => g.x + g.w > -10);
    flies = flies.filter(f => f.x > -20 && !f.got);

    sinceSpawn += dx;
    if (sinceSpawn >= nextSpacing && gatesSpawned < L.gates) {
      sinceSpawn = 0;
      spawnGate(L);
      gatesSpawned++;
      nextSpacing = H * lerp(0.40, 0.26, stress);
    }
    if (!finish && gatesSpawned >= L.gates && sinceSpawn >= H * 0.35) finish = { x: W + 10 };

    // Gegner
    if (!finish) {
      enemyTimer -= sdt;
      if (enemyTimer <= 0) { spawnEnemy(L); enemyTimer = L.every * rand(0.7, 1.3); }
    }
    for (const e of enemies) {
      if (e.kind === 'ping') {
        e.x -= speed * 1.7 * sdt;
        e.ph += sdt * 4;
        e.y += Math.sin(e.ph) * H * 0.08 * sdt;
        // Benachrichtigungen suchen dich, wenn du hektisch bist
        const seek = clamp(L.homing + (stress - 0.3) * 1.5, 0, 1.5);
        if (e.x > ball.x) e.y += (ball.y - e.y) * seek * sdt;
      } else {
        e.x -= speed * 1.25 * sdt;
        e.y += e.vy * sdt;
        e.ph += dt;
        if (e.y < e.size * 1.5) { e.y = e.size * 1.5; e.vy = Math.abs(e.vy); }
        if (e.y > H - e.size * 1.5) { e.y = H - e.size * 1.5; e.vy = -Math.abs(e.vy); }
      }
    }
    enemies = enemies.filter(e => e.x > -60);

    // Kollisionen
    const hr = r * 0.8;
    for (const g of gates) {
      if (ball.x + hr > g.x && ball.x - hr < g.x + g.w) {
        if (ball.y - hr < g.gy - g.gap / 2 || ball.y + hr > g.gy + g.gap / 2) { hurt(); if (state !== 'play') return; }
      }
      if (!g.passed && g.x + g.w < ball.x) { g.passed = true; gatesPassed++; }
    }
    for (const e of enemies) {
      if (Math.hypot(e.x - ball.x, e.y - ball.y) < hr + e.size * 0.85) { hurt(); if (state !== 'play') return; }
    }
    for (const f of flies) {
      if (!f.got && stress < 0.6 && Math.hypot(f.x - ball.x, f.y - ball.y) < r * 2.4) {
        f.got = true; fliesLevel++; audio.firefly();
      }
    }
    if (finish && finish.x < ball.x) return levelDone();

    // Ruhe aufzeichnen
    sampleTimer += dt;
    while (sampleTimer >= 0.1) { sampleTimer -= 0.1; samples.push(stress); }
  }

  // ---------- Zeichnen ----------
  function roundRect(x, y, w, h, rad) {
    rad = Math.max(0, Math.min(rad, w / 2, h / 2));
    ctx.beginPath();
    ctx.moveTo(x + rad, y);
    ctx.arcTo(x + w, y, x + w, y + h, rad);
    ctx.arcTo(x + w, y + h, x, y + h, rad);
    ctx.arcTo(x, y + h, x, y, rad);
    ctx.arcTo(x, y, x + w, y, rad);
    ctx.closePath();
  }

  function drawPing(e) {
    const s = e.size;
    ctx.save();
    ctx.translate(e.x, e.y);
    // Nachrichtenblase
    ctx.fillStyle = '#fff';
    roundRect(-s, -s * 0.8, s * 2, s * 1.6, s * 0.45); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-s * 0.5, s * 0.7); ctx.lineTo(-s * 0.9, s * 1.2); ctx.lineTo(-s * 0.1, s * 0.75); ctx.fill();
    ctx.fillStyle = 'rgba(30,30,40,0.35)';
    for (let i = 0; i < 2; i++) { roundRect(-s * 0.65, -s * 0.35 + i * s * 0.45, s * (i ? 0.8 : 1.3), s * 0.2, s * 0.1); ctx.fill(); }
    // rotes Abzeichen
    ctx.fillStyle = '#ff3b30';
    ctx.beginPath(); ctx.arc(s * 0.95, -s * 0.75, s * 0.55, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = `800 ${Math.round(s * 0.75)}px system-ui, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('1', s * 0.95, -s * 0.72);
    ctx.restore();
  }

  function drawWecker(e) {
    const s = e.size;
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.rotate(Math.sin(time * 40) * 0.15);   // klingelt
    ctx.fillStyle = '#1b1b22';
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    for (const sx of [-1, 1]) { ctx.beginPath(); ctx.arc(sx * s * 0.7, -s * 0.85, s * 0.42, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); }
    ctx.beginPath(); ctx.arc(0, 0, s, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(0, 0, s * 0.75, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#1b1b22'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -s * 0.55); ctx.moveTo(0, 0); ctx.lineTo(s * 0.4, s * 0.1); ctx.stroke();
    ctx.restore();
  }

  function draw() {
    const s = stress;
    const s2 = s * s;
    const L = LEVELS[levelIdx];
    ctx.save();

    // Wackeln
    const shake = (s > 0.35 ? (s - 0.35) * H * 0.02 : 0) + flash * H * 0.02;
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    // Himmel
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, rgb(mix(L.calm.top, STRESS.top, s)));
    g.addColorStop(1, rgb(mix(L.calm.bot, STRESS.bot, s)));
    ctx.fillStyle = g;
    ctx.fillRect(-20, -20, W + 40, H + 40);

    // Partikel: ruhig weiche Punkte, hektisch Striche
    ctx.strokeStyle = rgb([255, 255, 255], lerp(0.35, 0.5, s));
    ctx.fillStyle = rgb([255, 255, 255], 0.35 * (1 - s) + 0.05);
    for (const p of particles) {
      const x = p.x * W, y = p.y * H;
      if (s < 0.3) {
        ctx.beginPath(); ctx.arc(x, y, p.r, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.lineWidth = p.r;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + s * 80 * p.v, y); ctx.stroke();
      }
    }

    // Tore
    if (gates) {
      const oc = mix(CALM_OBST, STRESS.obst, s);
      const oa = lerp(0.24, 0.95, s);
      const rad = lerp(H * 0.04, 0, s);
      for (const o of gates) {
        const top = o.gy - o.gap / 2, bot = o.gy + o.gap / 2;
        ctx.fillStyle = rgb(oc, oa);
        roundRect(o.x, -rad, o.w, top + rad, rad); ctx.fill();
        roundRect(o.x, bot, o.w, H - bot + rad, rad); ctx.fill();
        // Atmende Tore leuchten im Rhythmus, wandernde haben Pfeile
        if (o.type === 'atmend') {
          const pulse = 0.5 + 0.5 * Math.sin(o.phase + gameTime * 1.6);
          ctx.fillStyle = rgb([255, 255, 255], 0.15 + 0.35 * pulse);
          ctx.fillRect(o.x, top - 4, o.w, 4);
          ctx.fillRect(o.x, bot, o.w, 4);
        } else if (o.type === 'wandernd') {
          ctx.fillStyle = rgb([255, 255, 255], 0.5);
          const cx = o.x + o.w / 2, a = o.w * 0.22;
          ctx.beginPath(); ctx.moveTo(cx - a, top - a * 1.6); ctx.lineTo(cx + a, top - a * 1.6); ctx.lineTo(cx, top - a * 2.8); ctx.fill();
          ctx.beginPath(); ctx.moveTo(cx - a, bot + a * 1.6); ctx.lineTo(cx + a, bot + a * 1.6); ctx.lineTo(cx, bot + a * 2.8); ctx.fill();
        }
        if (s > 0.5) {
          ctx.strokeStyle = rgb([255, 255, 255], (s - 0.5) * 1.2);
          ctx.lineWidth = 2;
          ctx.strokeRect(o.x, -5, o.w, top + 5);
          ctx.strokeRect(o.x, bot, o.w, H - bot + 5);
        }
      }
    }

    // Glühwürmchen: verblassen bei Hektik
    if (flies) {
      const fa = clamp((0.65 - s) / 0.35, 0, 1);
      for (const f of flies) {
        const y = f.y + Math.sin(f.ph) * H * 0.008;
        const rr = H * 0.012;
        const glow = ctx.createRadialGradient(f.x, y, 0, f.x, y, rr * 4);
        glow.addColorStop(0, `rgba(255,245,160,${0.9 * fa})`);
        glow.addColorStop(0.3, `rgba(220,255,120,${0.35 * fa})`);
        glow.addColorStop(1, 'rgba(220,255,120,0)');
        ctx.fillStyle = glow;
        ctx.fillRect(f.x - rr * 4, y - rr * 4, rr * 8, rr * 8);
        ctx.fillStyle = `rgba(255,255,220,${fa})`;
        ctx.beginPath(); ctx.arc(f.x, y, rr * 0.45, 0, Math.PI * 2); ctx.fill();
      }
    }

    // Ziel
    if (finish) {
      const fg = ctx.createLinearGradient(finish.x - 30, 0, finish.x + 30, 0);
      fg.addColorStop(0, 'rgba(255,255,255,0)');
      fg.addColorStop(0.5, 'rgba(255,255,255,0.7)');
      fg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = fg;
      ctx.fillRect(finish.x - 30, 0, 60, H);
      ctx.fillStyle = '#fff';
      ctx.font = `700 ${Math.round(H * 0.035)}px system-ui, sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText('Ziel', finish.x, H * 0.16);
    }

    // Gegner
    if (enemies) for (const e of enemies) (e.kind === 'ping' ? drawPing : drawWecker)(e);

    // Kugel
    if (ball && state !== 'title' && state !== 'intro') {
      const r = H * 0.022 * (1 + 0.18 * inhale);
      const blink = invuln > 0 && Math.floor(time * 12) % 2 === 0;
      if (!blink) {
        const bc = mix(CALM_BALL, STRESS.ball, s);
        const jx = (Math.random() - 0.5) * s2 * 6, jy = (Math.random() - 0.5) * s2 * 6;
        ctx.shadowColor = rgb(bc, 0.9);
        ctx.shadowBlur = lerp(30, 4, s);
        ctx.fillStyle = rgb(bc);
        ctx.beginPath(); ctx.arc(ball.x + jx, ball.y + jy, r, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
      }
      if (shield) {
        ctx.strokeStyle = `rgba(190,255,230,${0.55 + 0.25 * Math.sin(time * 2)})`;
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(ball.x, ball.y, r * (2 + 0.15 * Math.sin(time * 2)), 0, Math.PI * 2); ctx.stroke();
      } else if (calmTimer > 0.5) {
        // Schild lädt sich auf
        ctx.strokeStyle = 'rgba(190,255,230,0.45)';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(ball.x, ball.y, r * 2, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.min(1, calmTimer / 3)); ctx.stroke();
      }
    }

    // Vignette mit Herzschlag
    if (s > 0.15) {
      const beat = 0.5 + 0.5 * Math.sin(time * lerp(4, 16, s));
      const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.2, W / 2, H / 2, H * 0.75);
      vg.addColorStop(0, 'rgba(0,0,0,0)');
      vg.addColorStop(1, rgb([30, 0, 0], clamp((s - 0.15) * (0.7 + 0.3 * beat), 0, 0.85)));
      ctx.fillStyle = vg;
      ctx.fillRect(-20, -20, W + 40, H + 40);
    }
    if (flash > 0) {
      ctx.fillStyle = `rgba(255,0,0,${flash * 0.35})`;
      ctx.fillRect(-20, -20, W + 40, H + 40);
    }
    // Flackern
    if (s > 0.65 && Math.random() < (s - 0.65) * 0.6) {
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.fillRect(-20, -20, W + 40, H + 40);
    }
    // Scanlines
    if (s > 0.5) {
      ctx.fillStyle = rgb([0, 0, 0], (s - 0.5) * 0.35);
      for (let y = (time * 200) % 6; y < H; y += 6) ctx.fillRect(0, y, W, 2);
    }

    ctx.restore();

    for (const p of popups) drawPopup(p);

    // Spruch
    if (saying) {
      const a = saying.t < 0.15 ? saying.t / 0.15 : saying.t > 1.1 ? Math.max(0, 1 - (saying.t - 1.1) / 0.5) : 1;
      const size = Math.round(Math.min(W * 0.13, H * 0.07) * (saying.soft ? 0.85 : 1 + (1 - Math.min(1, saying.t * 6)) * 0.3));
      ctx.save();
      ctx.globalAlpha = a;
      ctx.font = `800 ${size}px system-ui, sans-serif`;
      const mw = ctx.measureText(saying.text).width;
      if (mw > W * 0.9) ctx.font = `800 ${Math.floor(size * W * 0.9 / mw)}px system-ui, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 12;
      ctx.fillStyle = '#fff';
      const jit = saying.soft ? 0 : s * 4;
      ctx.fillText(saying.text, W / 2 + (Math.random() - 0.5) * jit, H * 0.32 + (Math.random() - 0.5) * jit);
      ctx.restore();
    }

    drawHud();
  }

  function drawPopup(p) {
    const slide = Math.min(1, p.t / 0.25);
    const a = (1 - Math.min(1, p.out)) * slide;
    const s = stress;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(0, (1 - slide) * -20 + (p.tapped ? 0 : 0));
    ctx.shadowColor = 'rgba(0,0,0,0.3)'; ctx.shadowBlur = 16; ctx.shadowOffsetY = 4;
    ctx.fillStyle = rgb(mix([248, 248, 252], [255, 235, 235], s), 0.94);
    roundRect(p.x, p.y, p.w, p.h, 18); ctx.fill();
    ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    const pad = p.h * 0.18, ic = p.h * 0.36;
    ctx.fillStyle = p.color;
    roundRect(p.x + pad, p.y + pad, ic, ic, ic * 0.25); ctx.fill();
    const fs = Math.round(p.h * 0.22);
    ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(30,30,40,0.6)';
    ctx.font = `600 ${Math.round(fs * 0.85)}px system-ui, sans-serif`;
    ctx.fillText(p.app.toUpperCase(), p.x + pad * 2 + ic, p.y + pad + ic / 2);
    ctx.textAlign = 'right';
    ctx.fillText('jetzt', p.x + p.w - pad, p.y + pad + ic / 2);
    ctx.textAlign = 'left';
    ctx.fillStyle = '#16161d';
    ctx.font = `700 ${fs}px system-ui, sans-serif`;
    ctx.fillText(p.text, p.x + pad, p.y + p.h * 0.7);
    // Restzeit: das Pop-up geht von selbst
    if (!p.gone) {
      ctx.fillStyle = 'rgba(30,30,40,0.25)';
      ctx.fillRect(p.x + 18, p.y + p.h - 4, (p.w - 36) * Math.max(0, 1 - p.t / p.life), 2);
    }
    ctx.restore();
  }

  function drawHud() {
    if (state === 'title' || state === 'intro' || !ball) return;
    const pad = Math.max(16, W * 0.06);
    const top = Math.max(18, H * 0.03);
    const barH = Math.max(14, H * 0.018);
    const fs = Math.round(Math.max(16, H * 0.024));
    ctx.save();
    ctx.font = `700 ${fs}px system-ui, sans-serif`;
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'left';
    ctx.fillText('RUHE', pad, top + barH / 2);
    const labelW = ctx.measureText('RUHE').width + 12;
    const bx = pad + labelW, bw = W - pad - bx;
    roundRect(bx, top, bw, barH, barH / 2);
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fill();
    const calm = 1 - stress;
    roundRect(bx, top, Math.max(barH, bw * calm), barH, barH / 2);
    ctx.fillStyle = rgb(mix([255, 40, 40], [140, 230, 180], calm)); ctx.fill();

    const y2 = top + barH + fs * 1.1;
    ctx.font = `600 ${Math.round(fs * 0.9)}px system-ui, sans-serif`;
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillText(`${LEVELS[levelIdx].name}  ·  ${gatesPassed}/${LEVELS[levelIdx].gates}`, pad, y2);
    ctx.textAlign = 'right';
    ctx.fillText(`✨${fliesLevel}  ${hearts(Math.max(0, nerves))}`, W - pad, y2);

    if (state === 'ready') {
      ctx.textAlign = 'center';
      ctx.font = `600 ${Math.round(fs * 1.2)}px system-ui, sans-serif`;
      ctx.fillStyle = `rgba(255,255,255,${0.6 + 0.4 * Math.sin(time * 3)})`;
      ctx.fillText('Halten', W / 2, H * 0.62);
    }
    ctx.restore();
  }

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  resetLevel();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
